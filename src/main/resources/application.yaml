
spring:  
  application:
    name: movie-api

  datasource:
    url: jdbc:mysql://localhost:3306/movie_api
    username: movie_api
    password: movie_api
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: troque-esta-chave-por-uma-bem-longa-e-aleatoria-depois
  expiration-ms: 3600000
