services:
  mysql:
    image: mysql:8.0
    container_name: movie-api-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movie_api
      MYSQL_USER: movie_api
      MYSQL_PASSWORD: movie_api
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
